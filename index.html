<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сцена · крутите пальцем</title>
<script src="model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#e8e8e5;overflow:hidden;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  model-viewer{width:100vw;height:100dvh;background:#e8e8e5;--poster-color:#e8e8e5}
  /* подсказка «крутите пальцем» — гаснет при первом касании */
  #hint{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(20,20,22,.72);color:#fff;padding:9px 16px;border-radius:999px;font-size:15px;
    letter-spacing:.2px;pointer-events:none;transition:opacity .5s ease;z-index:5}
  #hint.gone{opacity:0}
  #bar{position:fixed;top:0;left:0;height:3px;width:0;background:#2b7;z-index:6;transition:width .25s ease}
  #err{position:fixed;left:16px;right:16px;bottom:16px;background:#c0392b;color:#fff;padding:12px 14px;
    border-radius:12px;font-size:14px;display:none;z-index:7;line-height:1.35}
</style>
</head>
<body>
  <div id="bar"></div>
  <model-viewer id="mv" src="kurili_bed.glb"
    camera-controls touch-action="none"
    auto-rotate auto-rotate-delay="800" rotation-per-second="18deg"
    interaction-prompt="none"
    shadow-intensity="1" exposure="1.1" environment-image="neutral"
    camera-orbit="35deg 72deg auto" min-field-of-view="10deg">
  </model-viewer>
  <div id="hint">крутите пальцем</div>
  <div id="err"></div>
<script>
  const mv=document.getElementById('mv');
  const bar=document.getElementById('bar');
  const hint=document.getElementById('hint');
  const err=document.getElementById('err');
  function fail(m){err.style.display='block';err.textContent='Не загрузилось: '+m;bar.style.background='#c0392b';bar.style.width='100%';}
  mv.addEventListener('progress',e=>{const p=Math.max(2,Math.round(e.detail.totalProgress*100));bar.style.width=p+'%';if(p>=100){setTimeout(()=>bar.style.opacity=0,400);}});
  mv.addEventListener('load',()=>{bar.style.width='100%';});
  mv.addEventListener('error',e=>fail(JSON.stringify(e.detail&&e.detail.type||e.detail||'источник модели')));
  window.addEventListener('error',e=>fail(e.message||'скрипт вьюера'));
  // подсказка гаснет при первом касании/клике
  ['pointerdown','touchstart'].forEach(ev=>mv.addEventListener(ev,()=>hint.classList.add('gone'),{once:true,passive:true}));
</script>
</body>
</html>
